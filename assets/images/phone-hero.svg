<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Premium smartphones display</title>
  <desc id="desc">Three glossy smartphones with neon retail lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset=".52" stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="700" rx="54" fill="url(#bg)"/>
  <circle cx="690" cy="155" r="120" fill="#22d3ee" opacity=".2" filter="url(#glow)"/>
  <circle cx="225" cy="520" r="150" fill="#8b5cf6" opacity=".24" filter="url(#glow)"/>
  <g transform="translate(160 86) rotate(-8)">
    <rect width="230" height="500" rx="42" fill="#020617" stroke="#334155" stroke-width="10"/>
    <rect x="22" y="34" width="186" height="432" rx="30" fill="url(#screen)"/>
    <circle cx="116" cy="52" r="9" fill="#020617"/>
  </g>
  <g transform="translate(342 56)">
    <rect width="250" height="540" rx="46" fill="#020617" stroke="#475569" stroke-width="11"/>
    <rect x="24" y="38" width="202" height="462" rx="32" fill="url(#screen)"/>
    <path d="M58 390c68-98 113-122 168-72v182H58z" fill="#020617" opacity=".28"/>
    <circle cx="126" cy="58" r="9" fill="#020617"/>
  </g>
  <g transform="translate(570 120) rotate(9)">
    <rect width="205" height="450" rx="38" fill="#020617" stroke="#334155" stroke-width="9"/>
    <rect x="20" y="32" width="165" height="386" rx="28" fill="url(#screen)"/>
  </g>
</svg>
