<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gbg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#020617"/>
      <stop offset=".5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="gscreen" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset=".5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#gbg)"/>
  <!-- phone body -->
  <rect x="150" y="60" width="300" height="780" rx="46" fill="#050816" stroke="#475569" stroke-width="10"/>
  <!-- screen -->
  <rect x="172" y="98" width="256" height="704" rx="34" fill="url(#gscreen)"/>
  <!-- punch-hole camera -->
  <circle cx="300" cy="124" r="12" fill="#020617"/>
  <!-- glow -->
  <ellipse cx="300" cy="380" rx="110" ry="130" fill="#22d3ee" opacity=".09"/>
  <path d="M172 580 c60-90 120-110 256-50 v222 H172z" fill="#8b5cf6" opacity=".11"/>
  <!-- home indicator -->
  <rect x="248" y="778" width="104" height="6" rx="3" fill="url(#gacc)" opacity=".7"/>
  <!-- side buttons -->
  <rect x="140" y="250" width="10" height="50" rx="5" fill="#1e293b"/>
  <rect x="140" y="320" width="10" height="90" rx="5" fill="#1e293b"/>
  <rect x="450" y="290" width="10" height="90" rx="5" fill="#1e293b"/>
</svg>
