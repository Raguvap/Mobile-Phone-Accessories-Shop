<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ibg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset=".6" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="iscreen" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#111827"/>
      <stop offset=".5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iacc" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#a3e635"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#ibg)"/>
  <!-- phone body -->
  <rect x="150" y="60" width="300" height="780" rx="52" fill="#09090b" stroke="#334155" stroke-width="10"/>
  <!-- screen -->
  <rect x="172" y="100" width="256" height="700" rx="38" fill="url(#iscreen)"/>
  <!-- dynamic island -->
  <rect x="248" y="118" width="104" height="28" rx="14" fill="#000"/>
  <!-- glow -->
  <ellipse cx="300" cy="420" rx="110" ry="130" fill="#22d3ee" opacity=".10"/>
  <ellipse cx="300" cy="640" rx="80" ry="80" fill="#a3e635" opacity=".08"/>
  <!-- home indicator -->
  <rect x="248" y="778" width="104" height="6" rx="3" fill="url(#iacc)" opacity=".7"/>
  <!-- side buttons -->
  <rect x="140" y="260" width="10" height="60" rx="5" fill="#1e293b"/>
  <rect x="140" y="340" width="10" height="80" rx="5" fill="#1e293b"/>
  <rect x="450" y="300" width="10" height="90" rx="5" fill="#1e293b"/>
</svg>
